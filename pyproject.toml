[project]
name = "automl"
version = "0.1.0"
description = "AutoML for tabular data: XGBoost + Optuna at the core, an LLM layer that understands the task and writes the report."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
automl = "automl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "NPY",     # numpy-specific rules (legacy random API etc.)
    "PTH",     # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Math notation: G and H are gradient/hessian sums, not constants, so "G < x" is not a Yoda condition.
"src/automl/boosting/**" = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]

[tool.uv]
default-groups = ["dev", "notebooks"]
